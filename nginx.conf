# Gateway for the production stack: the host-level nginx (outside Docker)
# terminates TLS and forwards to this container on 127.0.0.1:8096; this just
# splits traffic between the API/static files and the Next.js frontend.
server {
  listen 80;
  client_max_body_size 20m;
  server_tokens off;

  location /api/ {
    proxy_pass http://backend:8010;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /static/ {
    proxy_pass http://backend:8010;
    proxy_set_header Host $host;
  }

  location /uploads/ {
    proxy_pass http://backend:8010;
    proxy_set_header Host $host;
  }

  location / {
    proxy_pass http://frontend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
