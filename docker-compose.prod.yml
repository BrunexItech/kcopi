# Production stack for community.bitafrica.co.ke. The host-level nginx vhost
# for that domain already proxies to 127.0.0.1:8096, so the gateway below
# binds to that exact port and nothing outside this file needs to change.
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-https://community.bitafrica.co.ke}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env.prod}
      DATABASE_URL: sqlite:////data/kcopiglobal.db
    volumes:
      - backend_data:/data
      - backend_uploads:/app/static/uploads

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://community.bitafrica.co.ke}
    restart: unless-stopped
    depends_on:
      - backend

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8096:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  backend_data:
  backend_uploads:
